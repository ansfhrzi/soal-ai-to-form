<style>
/* ============================================================================
   Stylesheet.html — seluruh CSS inline (tanpa CDN, aman di iframe sandbox)
   ========================================================================== */
:root {
  --bg: #f4f6fb;
  --bg-soft: #eceffa;
  --surface: #ffffff;
  --surface-2: #f8f9fd;
  --border: #e2e6f0;
  --border-strong: #cfd6e6;
  --text: #141a2b;
  --muted: #64708a;
  --primary: #4f46e5;
  --primary-soft: #eef0ff;
  --accent: #0d9488;
  --accent-soft: #e6f7f5;
  --danger: #dc2626;
  --danger-soft: #fdecec;
  --warn: #b45309;
  --warn-soft: #fef6e7;
  --ok: #15803d;
  --ok-soft: #e9f7ee;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 12px 32px -18px rgba(16, 24, 40, .28);
  --shadow-lg: 0 24px 60px -22px rgba(16, 24, 40, .45);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

[data-theme="dark"] {
  --bg: #0d1020;
  --bg-soft: #12162b;
  --surface: #161b31;
  --surface-2: #1c2340;
  --border: #262e4d;
  --border-strong: #35406a;
  --text: #e8ecf8;
  --muted: #99a3c0;
  --primary: #818cf8;
  --primary-soft: #1e2347;
  --accent: #2dd4bf;
  --accent-soft: #12312f;
  --danger: #f87171;
  --danger-soft: #331a1f;
  --warn: #fbbf24;
  --warn-soft: #33290f;
  --ok: #4ade80;
  --ok-soft: #12301d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -20px rgba(0, 0, 0, .8);
  --shadow-lg: 0 24px 60px -22px rgba(0, 0, 0, .9);
}

* { box-sizing: border-box; }

/* PENTING: atribut `hidden` harus selalu menang.
   Tanpa aturan ini, `display: grid/flex/block` pada sebuah class mengalahkan
   `[hidden]{display:none}` bawaan browser — gejalanya overlay "Sedang
   memproses…" sudah tampil sejak halaman dimuat dan tidak pernah hilang. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: 340px;
  background:
    radial-gradient(900px 300px at 12% -10%, rgba(79, 70, 229, .18), transparent 60%),
    radial-gradient(700px 260px at 88% -20%, rgba(13, 148, 136, .16), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.app { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 18px 18px 40px; }

/* ============================== TOPBAR ============================== */
.topbar {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 12px 16px; margin-bottom: 16px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: sticky; top: 8px; z-index: 40;
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-logo {
  display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 auto;
  border-radius: 12px; color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  box-shadow: 0 8px 18px -8px rgba(79, 70, 229, .9);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: 16px; letter-spacing: -.2px; }
.brand-text em { font-style: normal; font-size: 12px; color: var(--muted); }

.stepper { display: flex; gap: 6px; flex: 1 1 320px; justify-content: center; flex-wrap: wrap; }
.step {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 14px 7px 8px; border-radius: 999px; cursor: pointer;
  border: 1px solid transparent; background: transparent; color: var(--muted);
  font: inherit; font-weight: 600; font-size: 13.5px; transition: .18s;
}
.step:hover { background: var(--surface-2); color: var(--text); }
.step-n {
  display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg-soft); border: 1px solid var(--border); font-size: 12px;
}
.step.is-active { background: var(--primary-soft); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 30%, transparent); }
.step.is-active .step-n { background: var(--primary); border-color: var(--primary); color: #fff; }
.step.is-done .step-n { background: var(--accent); border-color: var(--accent); color: #fff; }

.topbar-side { display: flex; align-items: center; gap: 8px; }
.pill {
  padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
  white-space: nowrap;
}
.icon-btn {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer;
}
.icon-btn:hover { color: var(--primary); border-color: var(--primary); }

/* ============================== BANNER ============================== */
.banner {
  margin-bottom: 14px; padding: 11px 14px; border-radius: var(--radius-sm);
  background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  color: var(--warn); font-size: 13.5px;
}

/* ============================== LAYOUT ============================== */
.main { display: block; }
.panel { display: none; animation: fade .25s ease; }
.panel.is-active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; align-items: start; }
.span-4 { grid-column: span 4; }
.span-5 { grid-column: span 5; }
.span-7 { grid-column: span 7; }
.span-8 { grid-column: span 8; }
.span-12 { grid-column: span 12; }
@media (max-width: 980px) {
  .span-4, .span-5, .span-7, .span-8 { grid-column: span 12; }
  .topbar { position: static; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 16px;
}
.card-title {
  display: flex; align-items: center; gap: 9px;
  margin: 0 0 16px; font-size: 16.5px; letter-spacing: -.2px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head .card-title { margin: 0; }
.sub-title { margin: 22px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.dot.alt { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.badge {
  font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
  background: var(--primary-soft); color: var(--primary);
}

/* ============================== FORM FIELDS ============================== */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--text); }
.field .hint, small.hint { color: var(--muted); font-weight: 400; font-size: 11.8px; }
.req { color: var(--danger); }

input[type="text"], input[type="number"], input[type="password"], input:not([type]), select, textarea {
  width: 100%; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--text);
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  transition: border-color .15s, box-shadow .15s; outline: none;
}
textarea { resize: vertical; min-height: 44px; line-height: 1.5; }
input:focus, select:focus, textarea:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
}
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }

.row-2, .row-3, .row-4 { display: grid; gap: 12px; }
.row-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.row-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 760px) { .row-3, .row-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .row-2, .row-3, .row-4 { grid-template-columns: 1fr; } }

.stepper-input { display: flex; align-items: stretch; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.stepper-input input { border: 0; border-radius: 0; text-align: center; }
.stepper-input button { width: 38px; border: 0; background: var(--surface-2); color: var(--text); font-size: 18px; cursor: pointer; }
.stepper-input button:hover { background: var(--primary-soft); color: var(--primary); }

.range-wrap { display: flex; align-items: center; gap: 10px; }
.range-wrap input[type="range"] { flex: 1; padding: 0; border: 0; accent-color: var(--primary); }
.range-wrap output { font-family: var(--mono); font-size: 13px; min-width: 34px; text-align: right; color: var(--primary); font-weight: 700; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; cursor: pointer; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip span {
  display: inline-block; padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); transition: .15s;
}
.chip:hover span { border-color: var(--primary); color: var(--primary); }
.chip input:checked + span { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 6px 14px -8px var(--primary); }
.chip input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }

/* switch */
.switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; border-radius: 999px; background: var(--border-strong); transition: .2s; cursor: pointer;
}
.slider::before {
  content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider::before { transform: translateX(18px); }
.switch-row { display: flex; align-items: center; gap: 9px; font-size: 13.5px; margin-bottom: 4px; }
.switch-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 18px; }
@media (max-width: 700px) { .switch-grid { grid-template-columns: 1fr; } }

.input-group { display: flex; gap: 8px; }
.input-group input { flex: 1; }

/* ============================== BUTTONS ============================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 600;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  transition: transform .12s, box-shadow .15s, background .15s, border-color .15s;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn.primary { background: linear-gradient(135deg, var(--primary), #6d5ef0); border-color: transparent; color: #fff; box-shadow: 0 10px 22px -12px var(--primary); }
.btn.primary:hover { color: #fff; filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: var(--border); color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--primary); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.small { padding: 6px 11px; font-size: 12.8px; border-radius: 8px; }
.btn.big { padding: 13px 22px; font-size: 15px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.sticky-actions { position: sticky; bottom: 0; padding: 14px 0 4px; background: linear-gradient(to top, var(--surface) 65%, transparent); justify-content: space-between; }

/* ============================== INFO / RESULT ============================== */
.info-box { padding: 12px 14px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 12px; }
.info-box strong { display: block; font-size: 13px; margin-bottom: 3px; }
.info-box p { margin: 0; font-size: 12.8px; color: var(--muted); }
.info-box.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.info-box.warn strong, .info-box.warn p { color: var(--warn); }

.howto { margin: 0 0 16px; padding-left: 20px; font-size: 13.4px; color: var(--muted); }
.howto li { margin-bottom: 7px; }
.howto b { color: var(--text); }

.result { margin-top: 16px; padding: 16px; border-radius: var(--radius-sm); background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.result.error { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.result.small { font-size: 13px; }
.result h4 { margin: 0 0 10px; font-size: 14.5px; color: var(--ok); }
.result.error h4 { color: var(--danger); }
.result .links { display: flex; flex-direction: column; gap: 8px; }
.result a {
  display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border); text-decoration: none;
  color: var(--text); font-size: 13.4px; font-weight: 600; word-break: break-all;
}
.result a:hover { border-color: var(--primary); color: var(--primary); }
.result .meta { margin-top: 10px; font-size: 12.4px; color: var(--muted); }

/* ============================== DAFTAR SOAL ============================== */
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.summary .pill { background: var(--surface-2); }

.empty { text-align: center; padding: 46px 18px; color: var(--muted); }
.empty svg { opacity: .35; margin-bottom: 10px; }
.empty p { margin: 0 0 14px; font-size: 14px; }

.q-list { display: flex; flex-direction: column; gap: 14px; }
.q-card {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  overflow: hidden; transition: border-color .15s, box-shadow .15s;
}
.q-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.q-card.is-invalid { border-color: color-mix(in srgb, var(--danger) 55%, transparent); }

.q-head {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  background: var(--surface-2); border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.q-num {
  display: grid; place-items: center; min-width: 30px; height: 30px; padding: 0 7px;
  border-radius: 9px; background: var(--primary); color: #fff; font-weight: 700; font-size: 13px;
}
.q-type {
  padding: 4px 10px; border-radius: 999px; font-size: 11.6px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
}
.q-level { padding: 4px 9px; border-radius: 999px; font-size: 11.4px; font-weight: 700; background: var(--bg-soft); color: var(--muted); border: 1px solid var(--border); }
.q-points { margin-left: auto; font-size: 12.4px; color: var(--muted); font-weight: 600; }
.q-points input { width: 62px; padding: 4px 7px; font-size: 12.5px; text-align: center; }
.q-tools { display: flex; gap: 6px; }
.q-body { padding: 14px; }
.q-body textarea.q-text { min-height: 88px; line-height: 1.5; }
.q-wacana { margin-bottom: 10px; }
.q-wacana > span { display: block; font-size: 12.2px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.q-wacana textarea.q-stim {
  min-height: 110px; font-size: 13.4px;
  background: var(--surface-2); border-style: dashed;
}

.opt-row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.opt-letter {
  display: grid; place-items: center; width: 28px; height: 28px; flex: 0 0 auto;
  border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2);
  font-size: 12.5px; font-weight: 700; color: var(--muted);
}
.opt-row input[type="text"] { flex: 1; }
.opt-mark { display: flex; align-items: center; gap: 5px; font-size: 11.6px; color: var(--muted); flex: 0 0 auto; cursor: pointer; }
.opt-mark input { width: 17px; height: 17px; accent-color: var(--ok); cursor: pointer; }
.opt-row.is-correct { background: var(--ok-soft); border-radius: 9px; padding: 3px 6px; margin-left: -6px; margin-right: -6px; }
.opt-row.is-correct .opt-letter { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt-del { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 6px; }
.opt-del:hover { background: var(--danger-soft); color: var(--danger); }

.q-extra { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
@media (max-width: 700px) { .q-extra { grid-template-columns: 1fr; } }
.q-extra label span { font-size: 12.2px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
.q-extra textarea { min-height: 60px; font-size: 13.4px; }
.q-warn { margin-top: 8px; font-size: 12.4px; color: var(--danger); font-weight: 600; }

/* JSON box */
.json-box { margin: 12px 0; }
.json-box textarea {
  width: 100%; min-height: 320px; font-family: var(--mono); font-size: 12.6px; line-height: 1.55;
  background: #0f1226; color: #d7e0ff; border-color: #232a4d; border-radius: var(--radius-sm);
}
[data-theme="dark"] .json-box textarea { background: #0a0d1c; }
.json-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

/* ============================== OVERLAY & TOAST ============================== */
.overlay {
  position: fixed; inset: 0; z-index: 90; display: grid; place-items: center;
  background: color-mix(in srgb, #070a18 62%, transparent); backdrop-filter: blur(3px); padding: 20px;
}
.overlay-card {
  width: min(440px, 100%); text-align: center; padding: 28px 24px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-lg);
}
.overlay-card h3 { margin: 14px 0 6px; font-size: 16px; }
.overlay-card p { margin: 0 0 16px; font-size: 13.4px; color: var(--muted); }
.spinner {
  width: 46px; height: 46px; margin: 0 auto; border-radius: 50%;
  border: 3px solid var(--border); border-top-color: var(--primary); animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.progress { height: 6px; border-radius: 99px; background: var(--bg-soft); overflow: hidden; margin-bottom: 10px; }
.progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .4s ease; }

.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 120; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, 92vw); }
.toast {
  padding: 11px 14px; border-radius: 12px; font-size: 13.4px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
  border-left: 4px solid var(--primary); animation: slideIn .22s ease;
}
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--danger); }
.toast.warn { border-left-color: var(--warn); }
@keyframes slideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

.key-status { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-2); }
.key-status .ks-empty { padding: 12px; font-size: 12.8px; color: var(--muted); margin: 0; }
.ks-head { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 12.4px; }
.ks-item { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 12.8px; }
.ks-item:last-child { border-bottom: 0; }
.ks-label { font-family: var(--mono); font-weight: 700; min-width: 52px; }
.ks-tail { font-family: var(--mono); color: var(--muted); }
.ks-badge { margin-left: auto; padding: 2px 9px; border-radius: 999px; font-size: 11.4px; font-weight: 700; }
.ks-badge.siap { background: var(--ok-soft); color: var(--ok); }
.ks-badge.istirahat { background: var(--warn-soft); color: var(--warn); }
.ks-badge.bermasalah { background: var(--danger-soft); color: var(--danger); }
.ks-cursor { font-size: 11.4px; color: var(--primary); font-weight: 700; }
code { font-family: var(--mono); font-size: .92em; background: var(--bg-soft); padding: 1px 5px; border-radius: 5px; }

.footer {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
  font-size: 12.4px; color: var(--muted);
}

/* cetak */
@media print {
