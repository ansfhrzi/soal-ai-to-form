<script>
/* ============================================================================
   JavaScript.html — seluruh logika sisi client
   ----------------------------------------------------------------------------
   • Berkomunikasi dengan Apps Script lewat google.script.run
   • Bila dibuka di luar Apps Script (mis. pratinjau file) otomatis masuk
     MODE DEMO dengan data contoh, supaya UI tetap bisa dilihat & dicoba
   ============================================================================ */

(function () {
  'use strict';

  /* ========================== 0. KONEKSI GAS ========================== */
  var GAS = (typeof google !== 'undefined' && google.script && google.script.run) ? google.script.run : null;

  /** Pemanggilan: srv('fn').run(...argumen, onSuccess, onError) */
  function srv(fn) {
    return {
      run: function () {
        var args = Array.prototype.slice.call(arguments);
        var onErr = args.pop();
        var onOk = args.pop();
        if (typeof onOk !== 'function') {
          args.push(onOk);
          onOk = onErr;
          onErr = function () {};
        }
        if (!GAS) { if (typeof onErr === 'function') onErr(new Error('DEMO')); return; }
        GAS.withSuccessHandler(onOk).withFailureHandler(onErr)[fn].apply(null, args);
      }
    };
  }

  /* ========================== 1. STATE ========================== */
  var TIPE_LABEL = {
    pg: 'Pilihan Ganda',
    pg_kompleks: 'PG Kompleks',
    dropdown: 'Dropdown',
    isian: 'Isian Singkat',
    essay: 'Essay'
  };
  var TIPE_NEED_OPTIONS = { pg: 1, pg_kompleks: 1, dropdown: 1 };
  var DEMO_MODELS = ['gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite',
    'gemini-2.5-flash-lite', 'gemini-2.5-flash', 'gemini-2.0-flash'];

  var state = {
    demo: !GAS,
    questions: [],
    meta: {},
    config: { provider: 'gemini', model: '', modelRotasi: [], hasKey: false, keys: [], jmlKey: 0 },
    panel: 1
  };

  var $ = function (id) { return document.getElementById(id); };
  function q(sel, root) { return (root || document).querySelector(sel); }
  function qa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function huruf(i) { return String.fromCharCode(65 + i); }

  /** Ubah teks `\\n` dari AI jadi baris baru. */
  function bukaBaris(s) {
    return String(s == null ? '' : s)
      .replace(/\r\n/g, '\n')
      .replace(/\r/g, '\n')
      .replace(/\\r\\n/g, '\n')
      .replace(/\\n/g, '\n')
      .replace(/\\r/g, '\n');
  }

  /** Tempel paparan/cerita/wacana ke dalam teks soal — UI & Form hanya memakai q.text. */
  function gabungTeksSoal(q, stimulusGlobal) {
    q = q || {};
    var stim = bukaBaris(q.stimulus || q.wacana || '').trim();
    if (!stim && (q.pakaiStimulus || q.pakai_stimulus) && stimulusGlobal) {
      stim = bukaBaris(stimulusGlobal).trim();
    }
    q.text = bukaBaris(q.text || q.pertanyaan || q.question || '').trim();
    if (stim) {
      q.stimulus = stim;
      q.pakaiStimulus = true;
    }
    return q;
  }
  function tempelWacanaKeSoal(list, stimulusGlobal) {
    (list || []).forEach(function (q) { gabungTeksSoal(q, stimulusGlobal); });
    return list;
  }

  /**
   * Objek error dari Apps Script tiba sebagai object biasa, bukan Error —
   * memanggil `.message` padanya menghasilkan `undefined` dan tercetak
   * "[object Object]" di layar. Fungsi ini selalu mengembalikan string terbaca.
   */
  function errText(x) {
    if (x === null || typeof x === 'undefined') return 'tidak ada pesan error';
    if (typeof x === 'string') return x;
    var m = x.message || x.error || x.msg || x.details || x.errorMessage;
    if (m && typeof m === 'object') m = m.message || JSON.stringify(m);
    if (m) return (x.kode ? '[' + x.kode + '] ' : '') + String(m);
    try {
      var j = JSON.stringify(x);
      if (j && j !== '{}' && j !== 'null') return j;
    } catch (e) { /* abaikan */ }
    return String(x);
  }

  /* ========================== 2. TOAST & OVERLAY ========================== */
  function toast(msg, kind) {
    var box = $('toasts');
    var el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0'; el.style.transform = 'translateX(14px)';
      setTimeout(function () { el.remove(); }, 320);
    }, 4200);
  }

  var progTimer = null;
  function showOverlay(title, text) {
    $('overlayTitle').textContent = title || 'Sedang memproses…';
    $('overlayText').textContent = text || '';
    $('overlay').hidden = false;
    var bar = $('progressBar');
    bar.style.width = '8%';
    var p = 8;
    clearInterval(progTimer);
    progTimer = setInterval(function () {
      p = Math.min(94, p + (p < 60 ? 3.2 : 0.7));
      bar.style.width = p + '%';
    }, 420);
  }
  function updateOverlay(text) { $('overlayText').textContent = text; }
  function hideOverlay() {
    clearInterval(progTimer);
    $('progressBar').style.width = '100%';
    setTimeout(function () { $('overlay').hidden = true; $('progressBar').style.width = '0%'; }, 260);
  }

  /* ========================== 3. NAVIGASI PANEL ========================== */
  function goto(n) {
    n = Number(n);
    state.panel = n;
    qa('.panel').forEach(function (p) { p.classList.remove('is-active'); });
    var target = $('panel-' + n);
    if (target) target.classList.add('is-active');
    qa('.step').forEach(function (s) {
      var sn = Number(s.getAttribute('data-goto'));
      s.classList.toggle('is-active', sn === n);
      s.classList.toggle('is-done', sn < n);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ========================== 4. SPESIFIKASI ========================== */
  function chipsValues(containerId) {
    return qa('#' + containerId + ' input[type=checkbox]').filter(function (c) { return c.checked; })
      .map(function (c) { return c.value; });
  }
  function setChips(containerId, values) {
    qa('#' + containerId + ' input[type=checkbox]').forEach(function (c) {
      c.checked = values.indexOf(c.value) !== -1;
    });
  }

  function collectSpec() {
    return {
      mapel: $('f-mapel').value.trim(),
      kelas: $('f-kelas').value.trim(),
      kurikulum: $('f-kurikulum').value,
      topik: $('f-topik').value.trim(),
      cpTp: $('f-cpTp').value.trim(),
      indikator: $('f-indikator').value.trim(),
      jumlah: Math.max(1, Math.min(50, Number($('f-jumlah').value) || 10)),
      poin: Math.max(1, Number($('f-poin').value) || 1),
      tipe: chipsValues('chips-tipe'),
      level: chipsValues('chips-level'),
      kesulitan: $('f-kesulitan').value,
      preset: $('f-preset').value,
      bahasa: $('f-bahasa').value,
      materi: $('f-materi').value.trim(),
      instruksi: $('f-instruksi').value.trim(),
      pembahasan: $('f-pembahasan').checked,
      temperature: Number($('f-temp').value),
      format: $('f-format').value,
      thinking: $('f-thinking') ? $('f-thinking').value : 'off'
    };
  }

  function validateSpec(s) {
    if (!s.topik && !s.materi) { toast('Topik / materi wajib diisi.', 'err'); $('f-topik').focus(); return false; }
    if (!s.tipe.length) { toast('Pilih minimal satu tipe soal.', 'err'); return false; }
    if (!s.level.length) { toast('Pilih minimal satu level kognitif.', 'err'); return false; }
    if (s.jumlah > 30) toast('Jumlah soal ' + s.jumlah + ' — proses bisa lama. Pertimbangkan dibagi 2×.', 'warn');
    return true;
  }

  function updateEstimate() {
    var n = Number($('f-jumlah').value) || 10;
    var tipe = chipsValues('chips-tipe');
    var tokens = 2048 + n * 900;
    var detik = Math.round(6 + n * (tipe.length > 2 ? 1.6 : 1.1));
    $('estimate').textContent = n + ' soal ≈ ' + detik + '–' + (detik + 12) + ' detik · ±' +
      tokens.toLocaleString('id-ID') + ' token output · ' + (tipe.length ? tipe.join(', ') : '-');
  }

  /* ========================== 5. GENERATE ========================== */
  function generate(retryCount) {
    var spec = collectSpec();
    if (!validateSpec(spec)) return;
    retryCount = retryCount || 0;

    if (state.demo) {
      showOverlay('Mode demo — membuat contoh soal…', 'Tidak ada koneksi ke AI di pratinjau ini.');
      setTimeout(function () {
        state.questions = demoQuestions(spec);
        state.meta = { model: 'demo-model', provider: 'demo', elapsedMs: 1200, judul: '', deskripsi: '' };
        hideOverlay();
        afterGenerate(spec);
      }, 900);
      return;
    }

    if (!state.config.hasKey) {
      toast('API key belum disimpan. Buka halaman Pengaturan AI.', 'err');
      var link = $('btnShowAi');
      if (link && link.href) {
        try { window.top.location.href = link.href; } catch (eNav) {}
      }
      return;
    }

    showOverlay('Membuat soal dengan AI…',
      'Model ' + state.config.model + ' sedang menyusun ' + spec.jumlah + ' soal. Mohon tunggu.');
    $('btnGenerate').disabled = true;

    srv('generateQuestions').run(spec,
      function (res) {
        $('btnGenerate').disabled = false;
        hideOverlay();
        if (!res || !res.ok) {
          var msg = (res && errText(res)) || 'Gagal tanpa pesan error.';
          if (retryCount < 1 && /JSON|MAX_TOKENS|SAFETY/i.test(msg)) {
            toast('Percobaan pertama gagal, mengulang otomatis…', 'warn');
            return generate(retryCount + 1);
          }
          showResult($('testResult'), false, msg);
          toast('Gagal: ' + msg, 'err');
          return;
        }
        state.questions = res.questions || [];
        state.meta = res.meta || {};
        if (res.stimulus) state.meta.stimulus = res.stimulus;
        tempelWacanaKeSoal(state.questions, res.stimulus || state.meta.stimulus || '');
        afterGenerate(spec);
      },
      function (err) {
        $('btnGenerate').disabled = false;
        hideOverlay();
        toast('Error: ' + errText(err), 'err');
      });
  }

  function afterGenerate(spec) {
    tempelWacanaKeSoal(state.questions, '');
    if (!state.questions.length) { toast('AI tidak mengembalikan soal apa pun.', 'err'); return; }
    if (!$('g-title').value.trim()) {
      $('g-title').value = state.meta.judul || autoTitle(spec);
    }
    if (!$('g-desc').value.trim() && state.meta.deskripsi) $('g-desc').value = state.meta.deskripsi;
    renderQuestions();
    toast(state.questions.length + ' soal berhasil dibuat · ' + (state.meta.model || '-') +
      ' · ' + (state.meta.key || '') + ' · ' + ((state.meta.elapsedMs || 0) / 1000).toFixed(1) + ' s' +
      (state.meta.polos ? ' · mode JSON polos' : ''), 'ok');
    var dangling = state.questions.filter(function (q) {
      return q.warning && /tidak disertakan/.test(q.warning);
    }).length;
    if (dangling) {
      toast(dangling + ' soal merujuk paparan/wacana yang belum ada di dalam teks soal. Tempel wacananya di atas pertanyaan, atau ganti soal.', 'warn');
    }
    goto(2);
  }

  function autoTitle(spec) {
    return ['Latihan', spec.mapel, spec.kelas ? 'Kelas ' + spec.kelas : '', spec.topik]
      .filter(Boolean).join(' · ');
  }

  /* ========================== 6. RENDER SOAL ========================== */
  function renderSummary() {
    var counts = {}, totalPoin = 0;
    state.questions.forEach(function (q) {
      counts[q.type] = (counts[q.type] || 0) + 1;
      totalPoin += Number(q.points || 0);
    });
    var pills = Object.keys(counts).map(function (t) {
      return '<span class="pill">' + esc(TIPE_LABEL[t] || t) + ': <b>' + counts[t] + '</b></span>';
    });
    pills.push('<span class="pill">Total poin: <b>' + totalPoin + '</b></span>');
    if (state.meta.model) pills.push('<span class="pill">Model: <b>' + esc(state.meta.model) + '</b></span>');
    if (state.meta.key) pills.push('<span class="pill">Dipakai: <b>' + esc(state.meta.key) + '</b></span>');
    if (state.meta.percobaan) pills.push('<span class="pill">Percobaan: <b>' + state.meta.percobaan + '×</b></span>');
    $('summary').innerHTML = pills.join('');
    $('summary').hidden = false;
    $('badgeCount').textContent = state.questions.length;
    $('previewActions').hidden = state.questions.length === 0;
    $('emptyState').hidden = state.questions.length > 0;
  }

  function optionRowHtml(q, i, oi) {
    var isCorrect = (q.correctIdx || []).indexOf(oi) !== -1;
    var multi = q.type === 'pg_kompleks';
    return '' +
      '<div class="opt-row' + (isCorrect ? ' is-correct' : '') + '" data-oi="' + oi + '">' +
      '<span class="opt-letter">' + huruf(oi) + '</span>' +
      '<input type="text" class="opt-input" data-i="' + i + '" data-oi="' + oi + '" value="' + esc(q.options[oi]) + '" placeholder="Teks pilihan ' + huruf(oi) + '">' +
      '<label class="opt-mark" title="Tandai sebagai jawaban benar">' +
      '<input type="' + (multi ? 'checkbox' : 'radio') + '" class="opt-correct" name="correct-' + i + '" data-i="' + i + '" data-oi="' + oi + '"' + (isCorrect ? ' checked' : '') + '>' +
      '<span>benar</span></label>' +
      '<button type="button" class="opt-del" data-delopt="' + i + ':' + oi + '" title="Hapus opsi">✕</button>' +
      '</div>';
  }

  function questionCardHtml(q, i) {
    var multi = q.type === 'pg_kompleks';
    var needOpts = !!TIPE_NEED_OPTIONS[q.type];
    var options = q.options || [];
    var optsHtml = needOpts
      ? options.map(function (_, oi) { return optionRowHtml(q, i, oi); }).join('') +
        '<button type="button" class="btn small ghost" data-addopt="' + i + '">+ Tambah opsi</button>'
      : '<div class="opt-row"><input type="text" class="answer-text" data-i="' + i + '" value="' +
        esc(q.answerText || (options.length ? options[0] : '')) + '" placeholder="Kunci jawaban / poin kunci (untuk isian &amp; essay)"></div>';

    var invalid = needOpts && !(q.correctIdx && q.correctIdx.length);

    return '' +
      '<article class="q-card' + (invalid ? ' is-invalid' : '') + '" data-i="' + i + '">' +
      '<div class="q-head">' +
      '<span class="q-num">' + (i + 1) + '</span>' +
      '<select class="q-type" data-i="' + i + '" style="width:auto;padding:5px 28px 5px 9px;font-size:12.5px">' +
      Object.keys(TIPE_LABEL).map(function (t) {
        return '<option value="' + t + '"' + (q.type === t ? ' selected' : '') + '>' + TIPE_LABEL[t] + '</option>';
      }).join('') +
      '</select>' +
      (q.level ? '<span class="q-level">' + esc(q.level) + '</span>' : '') +
      (q.warning ? '<span class="q-level" style="color:var(--warn)">' + esc(q.warning) + '</span>' : '') +
      '<span class="q-points">poin <input type="number" class="q-points-input" data-i="' + i + '" min="0" step="1" value="' + esc(q.points) + '"></span>' +
      '<span class="q-tools">' +
      '<button type="button" class="btn small ghost" data-regen="' + i + '" title="Ganti soal ini saja">↻</button>' +
      '<button type="button" class="btn small ghost" data-dup="' + i + '" title="Duplikat">⧉</button>' +
      '<button type="button" class="btn small danger ghost" data-del="' + i + '" title="Hapus soal">🗑</button>' +
      '</span>' +
      '</div>' +
      '<div class="q-body">' +
      '<div class="q-wacana"><span>Wacana / paparan <small>(kosongkan jika soal mandiri)</small></span>' +
      '<textarea class="q-stim" data-i="' + i + '" placeholder="Teks bacaan/paparan. Di Google Form jadi Judul + Deskripsi.">' + esc(bukaBaris(q.stimulus || '')) + '</textarea></div>' +
      '<textarea class="q-text" data-i="' + i + '" placeholder="Kalimat tanya saja…">' + esc(bukaBaris(q.text)) + '</textarea>' +
      '<div class="opts" style="margin-top:10px">' + optsHtml + '</div>' +
      '<div class="q-extra">' +
      '<label><span>Pembahasan / umpan balik</span>' +
      '<textarea class="q-expl" data-i="' + i + '" placeholder="Penjelasan mengapa jawaban benar…">' + esc(q.explanation || '') + '</textarea></label>' +
      '<label><span>Level kognitif</span>' +
      '<input type="text" class="q-level-input" data-i="' + i + '" value="' + esc(q.level || '') + '" placeholder="C4"></label>' +
      '</div>' +
      (invalid ? '<div class="q-warn">⚠ Belum ada jawaban benar yang ditandai.</div>' : '') +
      '</div>' +
      '</article>';
  }

  function renderQuestions() {
    $('qList').innerHTML = state.questions.map(questionCardHtml).join('');
    renderSummary();
    syncJson();
    qa('textarea.q-text, textarea.q-stim').forEach(function (el) {
      el.style.height = 'auto';
      var minH = el.classList.contains('q-stim') ? 72 : 88;
      el.style.height = Math.min(520, Math.max(minH, el.scrollHeight + 6)) + 'px';
    });
  }

  function findQ(i) { return state.questions[Number(i)]; }

  /* --- delegasi event pada daftar soal --- */
  function bindList() {
    var list = $('qList');

    list.addEventListener('input', function (e) {
      var t = e.target, i = t.getAttribute('data-i');
      if (i === null) return;
      var qq = findQ(i); if (!qq) return;
      if (t.classList.contains('q-text')) qq.text = t.value;
      else if (t.classList.contains('q-stim')) qq.stimulus = t.value;
      else if (t.classList.contains('opt-input')) qq.options[Number(t.getAttribute('data-oi'))] = t.value;
      else if (t.classList.contains('q-expl')) qq.explanation = t.value;
      else if (t.classList.contains('q-level-input')) qq.level = t.value;
      else if (t.classList.contains('q-points-input')) qq.points = Number(t.value) || 0;
      else if (t.classList.contains('answer-text')) qq.answerText = t.value;
      syncJson();
    });

    list.addEventListener('change', function (e) {
      var t = e.target, i = t.getAttribute('data-i');
      if (i === null) return;
      var qq = findQ(i); if (!qq) return;

      if (t.classList.contains('opt-correct')) {
        var oi = Number(t.getAttribute('data-oi'));
        if (t.type === 'radio') qq.correctIdx = [oi];
        else {
          var arr = qq.correctIdx || [];
          var pos = arr.indexOf(oi);
          if (t.checked && pos === -1) arr.push(oi);
          if (!t.checked && pos !== -1) arr.splice(pos, 1);
          qq.correctIdx = arr;
        }
        renderQuestions();
        return;
      }
      if (t.classList.contains('q-type')) {
        qq.type = t.value;
        if (!TIPE_NEED_OPTIONS[qq.type]) {
          qq.answerText = qq.answerText || (qq.options[qq.correctIdx && qq.correctIdx[0]] || qq.options[0] || '');
        } else if (!qq.options.length) {
          qq.options = ['', '', '', ''];
          qq.correctIdx = [0];
        }
        if (qq.type !== 'pg_kompleks' && (qq.correctIdx || []).length > 1) qq.correctIdx = qq.correctIdx.slice(0, 1);
        renderQuestions();
      }
    });

    list.addEventListener('click', function (e) {
      var t = e.target.closest('button'); if (!t) return;
      var i, oi;

      if (t.hasAttribute('data-addopt')) {
        i = Number(t.getAttribute('data-addopt'));
        findQ(i).options.push('');
        renderQuestions();
      } else if (t.hasAttribute('data-delopt')) {
        var parts = t.getAttribute('data-delopt').split(':');
        i = Number(parts[0]); oi = Number(parts[1]);
        var qq = findQ(i);
        if (qq.options.length <= 2) { toast('Minimal 2 opsi.', 'warn'); return; }
        qq.options.splice(oi, 1);
        qq.correctIdx = (qq.correctIdx || []).filter(function (x) { return x !== oi; })
          .map(function (x) { return x > oi ? x - 1 : x; });
        renderQuestions();
      } else if (t.hasAttribute('data-del')) {
        i = Number(t.getAttribute('data-del'));
        if (!confirm('Hapus soal nomor ' + (i + 1) + '?')) return;
        state.questions.splice(i, 1);
        renderQuestions();
        toast('Soal dihapus.', 'ok');
      } else if (t.hasAttribute('data-dup')) {
        i = Number(t.getAttribute('data-dup'));
        var copy = JSON.parse(JSON.stringify(findQ(i)));
        state.questions.splice(i + 1, 0, copy);
        renderQuestions();
        toast('Soal diduplikasi.', 'ok');
      } else if (t.hasAttribute('data-regen')) {
        regenOne(Number(t.getAttribute('data-regen')), t);
      }
    });
  }

  /* ========================== 7. REGENERATE 1 SOAL ========================== */
  function regenOne(i, btn) {
    var spec = collectSpec();
    if (!spec.topik && !spec.materi) { toast('Topik belum diisi.', 'err'); goto(1); return; }

    if (state.demo) {
      var dq = demoQuestions(spec)[i % 6];
      dq.text = '[Demo, dibuat ulang] ' + dq.text;
      state.questions[i] = dq;
      renderQuestions();
      toast('Soal ' + (i + 1) + ' diganti (demo).', 'ok');
      return;
    }

    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    toast('Membuat ulang soal ' + (i + 1) + '…');
    srv('regenerateOneQuestion').run(spec, i, state.questions,
      function (res) {
        if (btn) { btn.disabled = false; btn.textContent = '↻'; }
        if (!res || !res.ok) { toast('Gagal: ' + errText(res || '-'), 'err'); return; }
        state.questions[i] = gabungTeksSoal(res.question, (state.meta && state.meta.stimulus) || '');
        renderQuestions();
        toast('Soal ' + (i + 1) + ' berhasil diganti.', 'ok');
      },
      function (err) {
        if (btn) { btn.disabled = false; btn.textContent = '↻'; }
        toast('Error: ' + errText(err), 'err');
      });
  }

  /* ========================== 8. JSON VIEW / IMPOR ========================== */
  function syncJson() {
    var area = $('jsonArea');
    if (!area) return;
    if (!$('jsonBox').hidden) {
      area.value = JSON.stringify({ soal: state.questions }, null, 2);
    }
  }

  function showJson(show) {
    $('jsonBox').hidden = !show;
    if (show) {
      $('jsonArea').value = JSON.stringify({ soal: state.questions }, null, 2);
      $('jsonArea').focus();
    }
    $('btnJsonView').textContent = show ? 'Tutup JSON' : '{ } Lihat JSON';
  }

  function applyJson() {
    var raw = $('jsonArea').value.trim();
    if (!raw) { toast('JSON kosong.', 'err'); return; }
    try {
      var data = JSON.parse(raw);
      var arr = Array.isArray(data) ? data : (data.soal || data.questions || data.items || []);
      if (!arr.length) throw new Error('Tidak ada properti "soal" berisi array.');
      var stim = String(data.stimulus || (state.meta && state.meta.stimulus) || '').trim();
      state.questions = arr.map(function (q, i) { return gabungTeksSoal(normalizeQ(q, i), stim); });
      renderQuestions();
      toast(state.questions.length + ' soal dimuat dari JSON.', 'ok');

      toast('JSON tidak valid: ' + err.message, 'err');

  function normalizeQ(q, i) {
    q = q || {};
    var type = String(q.type || q.tipe || 'pg').toLowerCase();
    if (!TIPE_LABEL[type]) type = 'pg';
    var options = (q.options || q.opsi || []).map(function (o) { return String(o == null ? '' : o); });
    var correct = (q.correctIdx || q.benar || q.correct || []);
    if (!Array.isArray(correct)) correct = [correct];
    correct = correct.map(function (c) {
      return typeof c === 'number' ? c : parseInt(String(c).trim(), 10);
    }).filter(function (c) { return !isNaN(c) && c >= 0 && c < options.length; });
    if (!correct.length && options.length) correct = [0];

    var text = bukaBaris(q.text || q.pertanyaan || q.question || ('Soal ' + (i + 1))).trim();
    var stim = bukaBaris(q.stimulus || q.wacana || '').trim();

    return {
      type: type,
      text: text,
      options: options,
      correctIdx: correct,
      answerText: String(q.answerText ||
        ((type === 'isian' || type === 'essay')
          ? (function () {
              var raw = q.benar || q.correct || q.kunci || q.jawaban || '';
              if (Array.isArray(raw)) raw = raw.join(' ');
              return String(raw).trim() || (correct.length ? options[correct[0]] : '');
            })()
          : '') || ''),
      points: Number(q.points || q.poin || 1) || 1,
      level: String(q.level || ''),
      explanation: String(q.explanation || q.pembahasan || ''),
      stimulus: String(q.stimulus || q.wacana || q.bacaan || ''),
      pakaiStimulus: !!(q.pakaiStimulus || q.pakai_stimulus || q.stimulus || q.wacana),
      warning: q.warning || ''
    };
  }

  function utf8Bytes(str) {
    var out = [];
    var i, c, c2, cp;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 128) out.push(c);
      else if (c < 2048) out.push(192 | (c >> 6), 128 | (c & 63));
      else if (c >= 0xD800 && c <= 0xDBFF) {
        c2 = str.charCodeAt(++i);
        cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
        out.push(240 | (cp >> 18), 128 | ((cp >> 12) & 63), 128 | ((cp >> 6) & 63), 128 | (cp & 63));
      } else out.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
    }
    return new Uint8Array(out);
  }

  var CRC_TABLE = (function () {
    var t = new Uint32Array(256), n, k, c;
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32Bytes(u8) {
    var c = 0xFFFFFFFF, i;
    for (i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function concatBytes(parts) {
    var len = 0, i, o = 0, out;
    for (i = 0; i < parts.length; i++) len += parts[i].length;
    out = new Uint8Array(len);
    for (i = 0; i < parts.length; i++) { out.set(parts[i], o); o += parts[i].length; }
    return out;
  }

  function u16b(n) { return new Uint8Array([n & 255, (n >>> 8) & 255]); }
  function u32b(n) {
    return new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]);
  }

  function zipStore(files) {
    var locals = [], centrals = [], offset = 0, i;
    for (i = 0; i < files.length; i++) {
      var name = utf8Bytes(files[i].name);
      var data = files[i].data;
      var crc = crc32Bytes(data);
      var local = concatBytes([
        new Uint8Array([0x50, 0x4b, 0x03, 0x04, 0x14, 0, 0, 0, 0, 0, 0, 0, 0, 0]),
        u32b(crc), u32b(data.length), u32b(data.length), u16b(name.length), u16b(0),
        name, data
      ]);
      var central = concatBytes([
        new Uint8Array([0x50, 0x4b, 0x01, 0x02, 0x14, 0, 0x14, 0, 0, 0, 0, 0, 0, 0, 0, 0]),
        u32b(crc), u32b(data.length), u32b(data.length),
        u16b(name.length), u16b(0), u16b(0), u16b(0), u16b(0), u32b(0), u32b(offset),
        name
      ]);
      locals.push(local);
      centrals.push(central);
      offset += local.length;
    }
    var loc = concatBytes(locals);
    var cen = concatBytes(centrals);
    var eocd = concatBytes([
      new Uint8Array([0x50, 0x4b, 0x05, 0x06, 0, 0, 0, 0]),
      u16b(files.length), u16b(files.length), u32b(cen.length), u32b(loc.length), u16b(0)
    ]);
    return concatBytes([loc, cen, eocd]);
  }

  function xmlEscTpl(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function teksKeDocx(lines) {
    var paras = lines.map(function (ln) {
      if (!String(ln).length) return '<w:p/>';
      return '<w:p><w:r><w:t xml:space="preserve">' + xmlEscTpl(ln) + '</w:t></w:r></w:p>';
    }).join('');
    var documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      '<w:body>' + paras + '<w:sectPr/></w:body></w:document>';
    var ctypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '</Types>';
    var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';
    var docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
    var bytes = zipStore([
      { name: '[Content_Types].xml', data: utf8Bytes(ctypes) },
      { name: '_rels/.rels', data: utf8Bytes(rels) },
      { name: 'word/document.xml', data: utf8Bytes(documentXml) },
      { name: 'word/_rels/document.xml.rels', data: utf8Bytes(docRels) }
    ]);
    return new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  }

  function fileToBase64(file, onOk, onErr) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var bytes = new Uint8Array(reader.result);
        var binary = '';
        var chunk = 0x8000;
        var i;
        for (i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunk, bytes.length)));
        }
        onOk(btoa(binary));
      } catch (e) { onErr(e); }
    };
    reader.onerror = function () { onErr(new Error('Gagal membaca file.')); };
    reader.readAsArrayBuffer(file);
  }

  function utf8ToB64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

      (r.folderUrl ? '<a href="' + esc(r.folderUrl) + '" target="_blank" rel="noopener">📁 Folder Drive: ' + esc(r.folderName || '') + '</a>' : '') +
      '</div>' +
      '<div class="meta">' + esc(r.title || '') + ' · ' + r.jumlahSoal + ' soal · ' + r.totalPoin + ' poin' +
      (breakdown ? '<br>' + esc(breakdown) : '') +
      (r.demo ? '<br><b>Deploy ke Apps Script agar form benar-benar dibuat.</b>' : '') +
      '</div>';

    var box = $('resultBox');
    box.className = 'result';
    box.innerHTML = html;
    box.hidden = false;
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /* ========================== 10. PENGATURAN AI ========================== */
  function loadConfig() {

      state.config = {

        keys: [], jmlKey: 0, keySiap: 0, keyIstirahat: 0, keyBermasalah: 0, autoRotate: true,
        version: 'demo', batasDetik: 240,
        defaultModels: { gemini: DEMO_MODELS.slice(), openai: ['gpt-4o-mini', 'gpt-4o'] }

  function paintConfig() {
    var c = state.config;
    $('s-provider').value = c.provider || 'gemini';
    $('s-model').value = c.autoRotate ? '' : (c.model || '');
    $('s-model').placeholder = 'auto — rotasi: ' + ((c.modelRotasi || c.defaultModels.gemini || []).slice(0, 3).join(' → ')) + ' …';
    $('s-baseurl').value = c.baseUrl || '';
    $('baseUrlField').hidden = (c.provider !== 'openai');

    $('keyStatus').textContent = c.hasKey
      ? c.jmlKey + ' key terpasang · ' + c.keySiap + ' siap · ' +
        (c.keyIstirahat || 0) + ' istirahat · ' + (c.keyBermasalah || 0) + ' bermasalah'
      : 'Belum ada key terpasang.';
    $('pillModel').textContent = 'AI: ' + (c.autoRotate ? 'rotasi' : (c.model || '-')) +
      (c.hasKey ? ' · ' + c.jmlKey + ' key' : ' · tanpa key') + (state.demo ? ' · demo' : '');
    if (c.batasDetik) {
      $('infoBatas').textContent = 'Rotasi berhenti setelah ±' + c.batasDetik +
        ' detik agar tidak menabrak batas 6 menit Apps Script. Untuk soal banyak, bagi jadi 2× generate.';
    }
    paintKeyStatus(c);
    fillModelDatalist(c.provider);

  /** Panel status: hanya 4 digit terakhir tiap key, plus status cooldown. */
  function paintKeyStatus(c) {
    var box = $('keyStatusBox');
    if (!box) return;
    var keys = c.keys || [];
    if (!keys.length) {
      box.innerHTML = '<p class="ks-empty">Belum ada API key terpasang.</p>';
      return;
    }
    var head = '<div class="ks-head">' +
      '<span class="pill">' + keys.length + ' key</span>' +
      '<span class="pill">' + (c.keySiap || 0) + ' siap</span>' +
      (c.keyIstirahat ? '<span class="pill">' + c.keyIstirahat + ' istirahat</span>' : '') +
      (c.keyBermasalah ? '<span class="pill">' + c.keyBermasalah + ' bermasalah</span>' : '') +
      '<span class="pill">cursor: key#' + (c.keyCursor || 0) + '</span>' +
      '</div>';
    var rows = keys.map(function (k) {
      var isCursor = (k.index === (c.keyCursor || 0));
      return '<div class="ks-item">' +
        '<span class="ks-label">' + esc(k.label || ('key#' + k.index)) + '</span>' +
        '<span class="ks-tail">…' + esc(k.ekor) + '</span>' +
        (isCursor ? '<span class="ks-cursor">← berikutnya</span>' : '') +
        '<span class="ks-badge ' + esc(k.status) + '">' + esc(k.status) + '</span>' +
        '</div>';
    }).join('');
    var modelLine = '<div class="ks-item"><span class="ks-label">Model</span>' +
      '<span class="ks-tail">' + esc(c.autoRotate ? 'rotasi otomatis' : (c.model || '-')) + '</span>' +
      '<span class="ks-badge siap">' + esc(c.modelAktif || '') + '</span></div>';
    box.innerHTML = head + rows + modelLine;
  }

  function refreshKeyStatus() {
    if (state.demo) {
      state.config.keys = [
        { index: 0, label: 'key#0', ekor: 'Ab12', status: 'siap' },
        { index: 1, label: 'key#1', ekor: 'Cd34', status: 'istirahat' },
        { index: 2, label: 'key#2', ekor: 'Ef56', status: 'bermasalah' }
      ];
      state.config.jmlKey = 3; state.config.keySiap = 1;
      state.config.keyIstirahat = 1; state.config.keyBermasalah = 1;
      state.config.hasKey = true; state.config.keyCursor = 0;
      paintConfig();
      toast('Mode demo: status contoh ditampilkan.', 'warn');
      return;
    }
    srv('getKeyStatus').run(function (res) {
      if (!res || !res.ok) {
        toast('Status gagal dimuat (key tetap tersimpan): ' + errText(res || '-'), 'warn');
        return;
      }
      var st = res.status;
      state.config.hasKey = st.terpasang;
      state.config.jmlKey = st.jml;
      state.config.keySiap = st.jml_siap;
      state.config.keyIstirahat = st.jml_istirahat;
      state.config.keyBermasalah = st.jml_bermasalah;
      state.config.keyCursor = st.cursor;
      state.config.keys = st.key;
      state.config.modelAktif = st.model_aktif;
      state.config.modelRotasi = st.model;
      state.config.autoRotate = !st.model_pilihan;
      state.config.model = st.model_pilihan || '';
      paintConfig();
      toast(st.jml + ' key diperiksa: ' + st.jml_siap + ' siap, ' +
        st.jml_istirahat + ' istirahat, ' + st.jml_bermasalah + ' bermasalah.',
        st.jml_siap ? 'ok' : 'warn');
    }, function (err) { toast('Error: ' + errText(err), 'err'); });
  }

  function resetCooldown() {
    if (state.demo) { toast('Mode demo: tidak ada cooldown nyata.', 'warn'); return; }
    srv('resetAiCooldown').run(function (res) {
      if (res && res.config) { state.config = res.config; paintConfig(); }
      toast('Cooldown dihapus — semua key & model dicoba ulang.', 'ok');
      refreshKeyStatus();
    }, function (err) { toast('Gagal: ' + errText(err), 'err'); });
  }

  function fillModelDatalist(provider) {
    var c = state.config;
    var list = provider === 'openai'
      ? ((c.defaultModels && c.defaultModels.openai) || ['gpt-4o-mini', 'gpt-4o'])
      : (c.modelRotasi && c.modelRotasi.length ? c.modelRotasi
        : ((c.defaultModels && c.defaultModels.gemini) || DEMO_MODELS.slice()));
    var items = ['auto'].concat(list);
    $('dl-models').innerHTML = items.map(function (m) {
      return '<option value="' + esc(m) + '">';
    }).join('');
  }

  function collectKeysFromTextarea() {
    return $('s-keys').value.split(/[\n,;]+/)
      .map(function (k) { return k.trim(); })
      .filter(function (k) { return k.length > 0 && k.indexOf('\u2022') === -1 && k.indexOf('*') === -1; });
  }

  function saveConfig() {
    var provider = $('s-provider').value;
    var keys = collectKeysFromTextarea();
    var modelRaw = $('s-model').value.trim();
    var cfg = {
      provider: provider,
      model: (!modelRaw || modelRaw === 'auto') ? '' : modelRaw,
      baseUrl: $('s-baseurl').value.trim()
    };
    if (keys.length) cfg.apiKeys = keys;

    if (state.demo) {
      state.config.provider = provider;
      state.config.model = cfg.model;
      state.config.autoRotate = !cfg.model;
      state.config.hasKey = keys.length > 0;
      state.config.jmlKey = keys.length;
      state.config.keySiap = keys.length;
      state.config.keys = keys.map(function (k, i) {
        return { index: i, label: 'key#' + i, ekor: k.slice(-4), status: 'siap' };
      });
      $('s-keys').value = '';
      paintConfig();
      toast('Mode demo: pengaturan tidak benar-benar disimpan.', 'warn');
      return;
    }

    srv('saveAiConfig').run(cfg, function (res) {
      state.config = res;
      $('s-keys').value = '';
      paintConfig();
      toast(keys.length
        ? (keys.length + ' key tersimpan di Script Properties (GEMINI_KEYS).')
        : 'Pengaturan tersimpan di Script Properties.', 'ok');
      if (res && res.peringatan) toast('Peringatan: ' + res.peringatan, 'warn');
      try { refreshKeyStatus(); } catch (e) { /* status gagal ≠ simpan gagal */ }
    }, function (err) { toast('Gagal menyimpan: ' + errText(err), 'err'); });
  }

  function testConnection() {
    if (state.demo) { toast('Mode demo: tes koneksi tidak tersedia.', 'warn'); return; }
    var btn = $('btnTest'); btn.disabled = true; btn.textContent = 'Menguji…';
    showResult($('testResult'), true, 'Mencoba seluruh key × model…');
    var modelRaw = $('s-model').value.trim();
    srv('testAiConnection').run((!modelRaw || modelRaw === 'auto') ? '' : modelRaw, function (res) {
      btn.disabled = false; btn.textContent = 'Tes Koneksi';
      showResult($('testResult'), !!res.ok, res.message);
      toast(res.ok ? 'Koneksi AI OK.' : 'Koneksi gagal.', res.ok ? 'ok' : 'err');
      refreshKeyStatus();
    }, function (err) {
      btn.disabled = false; btn.textContent = 'Tes Koneksi';
      showResult($('testResult'), false, errText(err));
    });
  }

    if (state.demo) { toast('Mode demo.', 'warn'); return; }

  /* ========================== 12. TEMA ========================== */
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem('soal-ai-theme'); } catch (e) {}
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    $('btnTheme').addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? '' : 'dark';
      if (cur) document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('soal-ai-theme', cur); } catch (e) {}
    });
  }

  /* ========================== 13. BINDING ========================== */
  function bind() {
    // navigasi
    qa('[data-goto]').forEach(function (b) {
      b.addEventListener('click', function () { goto(b.getAttribute('data-goto')); });
    });

    // stepper jumlah
    qa('[data-step]').forEach(function (b) {
      b.addEventListener('click', function () {
        var el = $(b.getAttribute('data-step'));
        var min = Number(el.min || 1), max = Number(el.max || 50);
        el.value = Math.max(min, Math.min(max, (Number(el.value) || min) + Number(b.getAttribute('data-delta'))));
        updateEstimate();
      });
    });

    $('f-jumlah').addEventListener('input', updateEstimate);
    $('f-poin').addEventListener('input', updateEstimate);
    qa('#chips-tipe input').forEach(function (c) { c.addEventListener('change', updateEstimate); });
    $('f-temp').addEventListener('input', function () { $('out-temp').textContent = this.value; });

    qa('#modeTabs [data-src]').forEach(function (b) {
      b.addEventListener('click', function () { setSumberMode(b.getAttribute('data-src')); });
    });
    var drop = $('wordDrop');
    var fileEl = $('wordFile');
    if (drop && fileEl) {
      drop.addEventListener('click', function (e) {
        if (e.target && e.target.id === 'wordFile') return;
        fileEl.click();
      });
      drop.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileEl.click(); }
      });
      ['dragenter', 'dragover'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('is-drag'); });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('is-drag'); });
      });
      drop.addEventListener('drop', function (e) {
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) setWordFile(f);
      });
      fileEl.addEventListener('change', function () {
        if (fileEl.files && fileEl.files[0]) setWordFile(fileEl.files[0]);
      });
    }
    qa('#tplGrid [data-tpl]').forEach(function (b) {
      b.addEventListener('click', function () { unduhTemplate(b.getAttribute('data-tpl')); });
    });
    if ($('btnParseWord')) $('btnParseWord').addEventListener('click', parseWordUpload);
    if ($('btnClearWord')) $('btnClearWord').addEventListener('click', clearWordUpload);
    if ($('btnImportWord')) {
      $('btnImportWord').addEventListener('click', function () {
        goto(1);
        setSumberMode('word');
        toast('Pilih file Word, lalu Konversi Word → Pratinjau.', 'warn');
      });
    }

    $('btnGenerate').addEventListener('click', function () { generate(0); });
    $('btnSample').addEventListener('click', fillSample);
    $('btnResetSpec').addEventListener('click', resetSpec);
    $('btnLoadDemo').addEventListener('click', function () {
      state.questions = demoQuestions(collectSpec());
      state.meta = { model: 'contoh', provider: 'demo' };
      renderQuestions();
      toast('Contoh soal dimuat.', 'ok');
    });
    $('btnRegenAll').addEventListener('click', function () { goto(1); toast('Sesuaikan spesifikasi lalu klik Generate.', 'warn'); });

    // panel 2
    $('btnJsonView').addEventListener('click', function () { showJson($('jsonBox').hidden); });
    $('btnApplyJson').addEventListener('click', applyJson);
    $('btnCopyJson').addEventListener('click', copyJson);
    $('btnDownloadJson').addEventListener('click', downloadJson);
    $('btnImportJson').addEventListener('click', function () {
      showJson(true);
      toast('Tempel JSON di kotak lalu klik "Terapkan JSON ke Pratinjau".', 'warn');
    });
    $('btnAddManual').addEventListener('click', addManual);

    // panel 3
    $('btnBuild').addEventListener('click', buildForm);
    if ($('btnSaveKey')) $('btnSaveKey').addEventListener('click', saveConfig);
    if ($('btnTest')) $('btnTest').addEventListener('click', testConnection);
    if ($('btnListModels')) $('btnListModels').addEventListener('click', listModels);
    if ($('btnClearKey')) $('btnClearKey').addEventListener('click', clearKey);
    if ($('btnRefreshStatus')) $('btnRefreshStatus').addEventListener('click', refreshKeyStatus);
    if ($('btnResetCooldown')) $('btnResetCooldown').addEventListener('click', resetCooldown);
    if ($('s-provider')) $('s-provider').addEventListener('change', function () {
      $('baseUrlField').hidden = this.value !== 'openai';
      fillModelDatalist(this.value);
      $('s-model').value = this.value === 'openai' ? 'gpt-4o-mini' : '';
      $('s-keys').placeholder = this.value === 'openai'
        ? 'sk-… (satu per baris)'
        : 'AIzaSy… (satu per baris, boleh banyak)';
    });

    bindList();

    // simpan spesifikasi ke localStorage (bila diizinkan)
    var fields = ['f-mapel', 'f-kelas', 'f-topik', 'f-poin', 'f-jumlah'];
    fields.forEach(function (id) {
      $(id).addEventListener('change', function () {
        try { localStorage.setItem('soal-ai-' + id, $(id).value); } catch (e) {}
      });
      try {
        var v = localStorage.getItem('soal-ai-' + id);
        if (v !== null && v !== '') $(id).value = v;
      } catch (e) {}
    });
  }

  /* ========================== 14. INIT ========================== */
  function init() {
